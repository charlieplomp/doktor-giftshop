<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winkel — Dr. Gift Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="logo">
      <span class="logo-icon">🩺</span>
      <span class="logo-text">
        <span class="logo-name">Dr. Gift Shop</span>
        <span class="logo-tagline">cadeaus voor dokters &amp; medici</span>
      </span>
    </a>
    <form class="search-bar" action="winkel.html" method="get">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" name="search" placeholder="Zoek producten…" aria-label="Zoek producten">
    </form>
  </div>
  <div class="nav-row">
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="winkel.html?cat=Keuken">Keuken</a>
      <a href="winkel.html?cat=Sieraden en accessoires">Sieraden en accessoires</a>
      <a href="winkel.html?cat=Kind">Kind</a>
      <a href="winkel.html?cat=Office">Office</a>
      <a href="winkel.html?cat=Sport">Sport</a>
      <a href="winkel.html?cat=Exclusief">Exclusief</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a href="cart.html" class="cart-link">
      <span class="cart-total" data-cart-total>€ 0,00</span>
      <span class="cart-count"><span data-cart-count>0</span> items</span>
      <svg class="basket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
    </a>
  </div>
</header>

<section class="section">
  <h2 class="section-title" id="shop-title">Alle producten</h2>
  <div class="filters" id="filters"></div>
  <div class="product-grid" id="product-grid"></div>
</section>

<footer class="site-footer">
  © Dr. Gift Shop 2024
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
<script>
  const CATEGORIES = ["Keuken", "Sieraden en accessoires", "Kind", "Office", "Sport", "Exclusief"];
  const params = new URLSearchParams(window.location.search);
  let activeCat = params.get("cat") || "Alles";
  let searchQuery = (params.get("search") || "").trim();

  function renderFilters() {
    const filters = document.getElementById("filters");
    const all = ["Alles", ...CATEGORIES];
    filters.innerHTML = all.map(cat => `
      <button class="filter-btn ${!searchQuery && cat === activeCat ? "active" : ""}" data-cat="${cat}">${cat}</button>
    `).join("");
    filters.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCat = btn.dataset.cat;
        searchQuery = "";
        const searchInput = document.querySelector(".search-bar input[name='search']");
        if (searchInput) searchInput.value = "";
        history.replaceState(null, "", activeCat === "Alles" ? "winkel.html" : `winkel.html?cat=${encodeURIComponent(activeCat)}`);
        renderFilters();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const grid = document.getElementById("product-grid");
    const title = document.getElementById("shop-title");
    let items = activeCat === "Alles"
      ? PRODUCTS
      : PRODUCTS.filter(p => p.categories.includes(activeCat));

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      items = items.filter(p => p.name.toLowerCase().includes(q));
      title.textContent = `Zoekresultaten voor "${searchQuery}"`;
    } else {
      title.textContent = activeCat === "Alles" ? "Alle producten" : activeCat;
    }

    if (items.length === 0) {
      grid.innerHTML = `<p style="grid-column: 1 / -1; color: #6f6f6f;">${searchQuery ? "Geen producten gevonden." : "Nog geen producten in deze categorie."}</p>`;
      return;
    }

    grid.innerHTML = items.map(p => `
      <a class="product-card" href="product.html?id=${p.id}">
        <div class="thumb"><img src="${p.image}" alt="${p.name}"></div>
        <p class="name">${p.name}</p>
        <p class="price">${formatPrice(p.price)}</p>
      </a>
    `).join("");
  }

  renderFilters();
  renderGrid();
</script>
</body>
</html>
