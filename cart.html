<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winkelwagen — Dr. Gift Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="logo">
      <span class="logo-icon">🩺</span>
      <span class="logo-text">
        <span class="logo-name">Dr. Gift Shop</span>
        <span class="logo-tagline">cadeaus voor dokters &amp; medici</span>
      </span>
    </a>
    <form class="search-bar" action="winkel.html" method="get">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" name="search" placeholder="Zoek producten…" aria-label="Zoek producten">
    </form>
  </div>
  <div class="nav-row">
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="winkel.html?cat=Keuken">Keuken</a>
      <a href="winkel.html?cat=Kind">Kind</a>
      <a href="winkel.html?cat=Office">Office</a>
      <a href="winkel.html?cat=Sport">Sport</a>
      <a href="winkel.html?cat=Exclusief">Exclusief</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a href="cart.html" class="cart-link">
      <span class="cart-total" data-cart-total>€ 0,00</span>
      <span class="cart-count"><span data-cart-count>0</span> items</span>
      <svg class="basket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
    </a>
  </div>
</header>

<section class="section">
  <h2 class="section-title">Winkelwagen</h2>
  <div id="cart-root"></div>
</section>

<footer class="site-footer">
  © Dr. Gift Shop 2024
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
<script>
  function renderCart() {
    const root = document.getElementById("cart-root");
    const items = getCartItems();

    if (items.length === 0) {
      root.innerHTML = `
        <div class="empty-cart">
          <p>Je winkelwagen is leeg.</p>
          <a class="btn" href="winkel.html">Bekijk de winkel</a>
        </div>
      `;
      return;
    }

    root.innerHTML = `
      <table class="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Aantal</th>
            <th>Prijs</th>
          </tr>
        </thead>
        <tbody>
          ${items.map(item => `
            <tr>
              <td>
                <div class="cart-item-info">
                  <img src="${item.image}" alt="${item.name}">
                  <div>
                    <p class="name">${item.name}</p>
                    <button class="remove-btn" data-remove="${item.id}">Verwijderen</button>
                  </div>
                </div>
              </td>
              <td>
                <div class="qty-control">
                  <button type="button" data-decrease="${item.id}">−</button>
                  <input type="text" value="${item.qty}" data-qty="${item.id}" inputmode="numeric">
                  <button type="button" data-increase="${item.id}">+</button>
                </div>
              </td>
              <td>${formatPrice(item.lineTotal)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      <div class="cart-summary">
        <div class="total-row">
          <span>Totaal</span>
          <span>${formatPrice(getCartTotal())}</span>
        </div>
        <button class="btn" id="checkout-btn" style="width:100%;">Afrekenen</button>
      </div>
    `;

    root.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => {
        removeFromCart(btn.dataset.remove);
        renderCart();
      });
    });
    root.querySelectorAll("[data-increase]").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = root.querySelector(`[data-qty="${btn.dataset.increase}"]`);
        setQty(btn.dataset.increase, parseInt(input.value, 10) + 1);
        renderCart();
      });
    });
    root.querySelectorAll("[data-decrease]").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = root.querySelector(`[data-qty="${btn.dataset.decrease}"]`);
        setQty(btn.dataset.decrease, parseInt(input.value, 10) - 1);
        renderCart();
      });
    });
    root.querySelectorAll("[data-qty]").forEach(input => {
      input.addEventListener("change", () => {
        setQty(input.dataset.qty, Math.max(1, parseInt(input.value, 10) || 1));
        renderCart();
      });
    });
    document.getElementById("checkout-btn").addEventListener("click", startCheckout);
  }

  renderCart();
</script>
</body>
</html>
