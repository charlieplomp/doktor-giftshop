<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Dr. Gift Shop</title>
<meta name="description" id="meta-description" content="Unieke cadeaus voor dokters, artsen en medisch personeel bij Dr. Gift Shop.">
<link rel="canonical" id="meta-canonical" href="https://www.dokter-giftshop.nl/product.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Dr. Gift Shop">
<meta property="og:title" id="meta-og-title" content="Dr. Gift Shop">
<meta property="og:description" id="meta-og-description" content="Unieke cadeaus voor dokters, artsen en medisch personeel.">
<meta property="og:image" id="meta-og-image" content="https://www.dokter-giftshop.nl/images/hero-navy.png">
<meta property="og:url" id="meta-og-url" content="https://www.dokter-giftshop.nl/product.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="logo">
      <span class="logo-icon">🩺</span>
      <span class="logo-text">
        <span class="logo-name">Dr. Gift Shop</span>
        <span class="logo-tagline">cadeaus voor dokters &amp; medici</span>
      </span>
    </a>
    <form class="search-bar" action="winkel.html" method="get">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" name="search" placeholder="Zoek producten…" aria-label="Zoek producten">
    </form>
  </div>
  <div class="nav-row">
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="winkel.html">Winkel</a>
      <a href="winkel.html?cat=Keuken">Keuken</a>
      <a href="winkel.html?cat=Kind">Kind</a>
      <a href="winkel.html?cat=Office">Office</a>
      <a href="winkel.html?cat=Sport">Sport</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a href="cart.html" class="cart-link">
      <span class="cart-total" data-cart-total>€ 0,00</span>
      <span class="cart-count"><span data-cart-count>0</span> items</span>
      <svg class="basket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
    </a>
  </div>
</header>

<div id="product-root"></div>

<footer class="site-footer">
  © Dr. Gift Shop 2024
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const product = PRODUCTS.find(p => p.id === params.get("id"));
  const root = document.getElementById("product-root");

  if (!product) {
    root.innerHTML = `
      <div class="section" style="text-align:center;">
        <p>Dit product bestaat niet (meer).</p>
        <a class="btn" href="winkel.html">Terug naar de winkel</a>
      </div>
    `;
  } else {
    document.title = product.name + " — Dr. Gift Shop";
    const productUrl = `https://www.dokter-giftshop.nl/product.html?id=${product.id}`;
    document.getElementById("meta-description").setAttribute("content", product.description);
    document.getElementById("meta-canonical").setAttribute("href", productUrl);
    document.getElementById("meta-og-title").setAttribute("content", product.name + " — Dr. Gift Shop");
    document.getElementById("meta-og-description").setAttribute("content", product.description);
    document.getElementById("meta-og-image").setAttribute("content", `https://www.dokter-giftshop.nl/${product.image}`);
    document.getElementById("meta-og-url").setAttribute("content", productUrl);

    const ldJson = document.createElement("script");
    ldJson.type = "application/ld+json";
    ldJson.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Product",
      name: product.name,
      description: product.description,
      image: `https://www.dokter-giftshop.nl/${product.image}`,
      url: productUrl,
      offers: {
        "@type": "Offer",
        priceCurrency: "EUR",
        price: product.price.toFixed(2),
        availability: "https://schema.org/InStock",
        url: productUrl
      }
    });
    document.head.appendChild(ldJson);

    const minQty = product.minQty || 1;
    const hasSizes = Array.isArray(product.sizes) && product.sizes.length > 0;
    root.innerHTML = `
      <div class="product-detail">
        <div class="thumb"><img src="${product.image}" alt="${product.name}"></div>
        <div class="product-info">
          <h1>${product.name}</h1>
          <p class="price">${formatPrice(product.price)}</p>
          <p class="description">${product.description}</p>
          ${hasSizes ? `
          <div class="size-row">
            <label for="size-select">Maat</label>
            <select id="size-select">
              <option value="">Kies een optie</option>
              ${product.sizes.map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>
          </div>
          ` : ""}
          <div class="qty-row">
            <div class="qty-control">
              <button type="button" id="qty-minus">−</button>
              <input type="text" id="qty-input" value="${minQty}" inputmode="numeric">
              <button type="button" id="qty-plus">+</button>
            </div>
            <button class="btn" id="add-btn">In winkelwagen</button>
          </div>
          <p class="size-error" id="size-error">Kies eerst een maat.</p>
          <p class="add-confirm" id="add-confirm">Toegevoegd aan je winkelwagen.</p>
        </div>
      </div>
    `;

    const qtyInput = document.getElementById("qty-input");
    document.getElementById("qty-minus").addEventListener("click", () => {
      qtyInput.value = Math.max(minQty, parseInt(qtyInput.value || String(minQty), 10) - 1);
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qtyInput.value = Math.max(minQty, parseInt(qtyInput.value || String(minQty), 10) + 1);
    });
    qtyInput.addEventListener("change", () => {
      qtyInput.value = Math.max(minQty, parseInt(qtyInput.value || String(minQty), 10) || minQty);
    });

    const sizeSelect = document.getElementById("size-select");
    const sizeError = document.getElementById("size-error");
    document.getElementById("add-btn").addEventListener("click", () => {
      if (hasSizes && !sizeSelect.value) {
        sizeError.classList.add("show");
        return;
      }
      sizeError.classList.remove("show");
      const qty = Math.max(minQty, parseInt(qtyInput.value || String(minQty), 10) || minQty);
      const cartId = hasSizes ? `${product.id}::${sizeSelect.value}` : product.id;
      addToCart(cartId, qty);
      const confirm = document.getElementById("add-confirm");
      confirm.classList.add("show");
      setTimeout(() => confirm.classList.remove("show"), 2000);
    });
  }
</script>
</body>
</html>
